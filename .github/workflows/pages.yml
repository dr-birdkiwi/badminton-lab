name: Deploy badminton lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: '1'

      - name: Prepare project Pages path
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          mkdir -p "dist/client/${repo_name}"
          cp dist/client/index.html "dist/client/${repo_name}/index.html"
          cp dist/client/index.rsc "dist/client/${repo_name}/index.rsc"
          cp dist/client/*.png dist/client/*.svg "dist/client/${repo_name}/"
          cp -R dist/client/_next "dist/client/${repo_name}/_next"
          sed -i "s#/_next/#/${repo_name}/_next/#g" "dist/client/${repo_name}/index.html"
          sed -i "s#/_next/#/${repo_name}/_next/#g" "dist/client/${repo_name}/index.rsc"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
